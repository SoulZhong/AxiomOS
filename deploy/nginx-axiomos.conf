# AxiomOS 的 Nginx 站点：axiom.tutorkin.com → 本机 127.0.0.1:8080 上的 axiomd。
#
# 这是只监听 80 的起始配置。证书由 certbot 的 nginx 插件申请，申请成功后它会原地改写这个文件，
# 加上 443 的 ssl 监听与 HTTP → HTTPS 跳转；SSL 那一段不要手改。整个过程由 deploy/setup-server.sh 完成：
#   sudo cp deploy/nginx-axiomos.conf /etc/nginx/sites-available/axiomos
#   sudo ln -sf /etc/nginx/sites-available/axiomos /etc/nginx/sites-enabled/axiomos
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d axiom.tutorkin.com --key-type ecdsa
#
# 与通用模板不同的地方：
#   - 上游是 Go 进程 axiomd（HTTP API /api/v1、MCP /mcp、接入链接 /connect、静态前端），端口 8080。
#   - /mcp 是给 Agent 的 Streamable HTTP 端点，一次调用可能持续较久：关掉响应缓冲、放宽读超时，
#     否则长响应会被 Nginx 攒着或在 60 秒时切断。
#   - X-Forwarded-Proto 必须带上：axiomd 用 SECURE_COOKIE=1 只在 HTTPS 下发会话 Cookie。
#   - 没有文件上传接口，交付物与外部链接都是地址，body 上限保持默认即可。

server {
    listen 80;
    server_name axiom.tutorkin.com;

    # Let's Encrypt 的 HTTP-01 验证路径（certbot --nginx 会自己处理，这里只是留个明确的位置）
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location /mcp {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300;
    }
}
